<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成與輸出 — Html in Canvas</title><link rel="stylesheet" href="examples.css"><style>#canvas{width:100%;height:auto;aspect-ratio:900/460}#composition{position:absolute;width:900px;height:460px;background:#edf1e3;transform-origin:0 0}.card{position:absolute;width:300px;height:330px;top:60px;background:#fffef7;padding:25px;border:1px solid #a6bc92;border-radius:12px}.card:nth-child(1){left:55px}.card:nth-child(2){left:540px;background:#e2edf0}.card p{font-size:14px}.card input{width:100%;font-size:16px;font-weight:600}.card textarea{font-size:14px;height:130px;margin-top:18px}#composition svg{position:absolute;inset:0;pointer-events:none}</style><a href="index.html">← 範例目錄</a><p class="eyebrow">02 / COMPOSITION · EXPORT</p><h1>把內容與關係，一起留下。</h1><p>修改卡片文字，再下載圖片。SVG 關係線包含在同一個 HTML 合成來源內。</p><div class="controls"><button id="download">下載 PNG</button><output id="status" class="status"></output></div><canvas id="canvas" width="900" height="460" content="drawable"><div id="composition" drawable><section class="card"><input aria-label="左卡標題" value="來源中的說法"><p>原始材料與你的觀點，保留各自的位置。</p><textarea aria-label="左卡筆記">這個結論使用了哪些假設？</textarea></section><section class="card"><input aria-label="右卡標題" value="自己的判斷"><p>用關係線指出支持、補充或質疑。</p><textarea aria-label="右卡筆記">先核對資料，再整理成文字。</textarea></section><svg width="900" height="460"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#537547"></path></marker></defs><path d="M355 220C420 170 470 270 540 220" stroke="#537547" fill="none" stroke-width="2" marker-end="url(#arrow)"></path><text x="450" y="195" text-anchor="middle" font-size="15" fill="#315d43">質疑假設</text></svg></div></canvas><div class="notice">toBlob 匯出已經繪製的合成畫布。若把關係 SVG 放在 Canvas 外，直接匯出 Canvas 就會遺漏它。</div><script type="module">
import{prepareCanvas,supportsCanvas,syncGeometry}from'./runtime.js';
const canvas=document.querySelector('#canvas'),root=document.querySelector('#composition'),status=document.querySelector('#status');
if(!supportsCanvas()){status.textContent='原生 API 不可用。';document.querySelector('#download').disabled=true;}else{
 prepareCanvas(canvas);const ctx=canvas.getContext('2d');canvas.width=900*devicePixelRatio;canvas.height=460*devicePixelRatio;
 canvas.addEventListener('paint',()=>{ctx.reset();ctx.scale(devicePixelRatio,devicePixelRatio);syncGeometry(canvas,root,ctx.drawElementImage(root,0,0,900,460));status.textContent=`${canvas.width} × ${canvas.height} px · HTML + SVG`;});
 root.addEventListener('input',()=>canvas.requestPaint());canvas.requestPaint();
 document.querySelector('#download').onclick=async()=>{await document.fonts.ready;canvas.requestPaint();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='html-composition.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});};
}
</script></html>
