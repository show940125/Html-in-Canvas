name: checks
on:
  push:
    branches: [main]
    paths:
      - "Canvas Clipper/**"
      - "shared/**"
      - "examples/**"
      - ".github/workflows/**"
      - LICENSE
      - NOTICE
      - THIRD_PARTY_NOTICES.md
      - .gitattributes
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Canvas Clipper/package-lock.json
      - run: npm --prefix "Canvas Clipper" ci
      - run: npm --prefix "Canvas Clipper" run check
      - run: npm --prefix "Canvas Clipper" test
      - run: npm --prefix "Canvas Clipper" run build
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-clipper-build
          path: Canvas Clipper/dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm --prefix "Canvas Clipper" ci
      - run: npm --prefix "Canvas Clipper" run build
      - run: python -m pip install -r "Canvas Clipper/requirements-test.txt"
      - run: python -m playwright install --with-deps chromium
      - name: Native Canvas and WebGL
        run: python "Canvas Clipper/scripts/v03_acceptance.py"
      - name: HTML compatibility without Canvas or GPU
        run: python "Canvas Clipper/scripts/compatibility_acceptance.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: Canvas Clipper/output/v03
