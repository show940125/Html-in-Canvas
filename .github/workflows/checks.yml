name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Canvas Clipper/package-lock.json
      - run: npm --prefix "Canvas Clipper" ci
      - run: npm --prefix "Canvas Clipper" run check
      - run: npm --prefix "Canvas Clipper" test
      - run: npm --prefix "Canvas Clipper" run build
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-clipper-build
          path: Canvas Clipper/dist
